name: SMM isolated checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.head_ref == 'feature/oxana-smm' || github.ref == 'refs/heads/feature/oxana-smm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OXANA_SMM_ENABLED: 'false'
      OXANA_REMINDERS: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run test:pii
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm run test:smm
        working-directory: server
      - run: npm test
        working-directory: server
