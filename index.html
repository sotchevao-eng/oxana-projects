<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OXANA PROJECTS — портфолио сайтов, web-приложений, автоматизаций и digital-проектов."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>OXANA PROJECTS</title>
    <script>
      try {
        var theme = localStorage.getItem('oxana-theme')
        document.documentElement.setAttribute(
          'data-theme',
          theme === 'dark' ? 'dark' : 'light',
        )
        document.documentElement.style.colorScheme =
          theme === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
